name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'scripts/**'
      - 'resources/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Pro Studio JavaScript syntax
        run: node --check www/extensions/pro-studio.js

      - name: Run logic tests
        run: node scripts/test-logic.mjs

      - name: Download and bundle CC0 music library
        run: node scripts/download-music.mjs

      - name: Optimize bundled music for mobile
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            shopt -s nullglob
            for f in www/audio/*.mp3; do
              ffmpeg -y -i "$f" -vn -codec:a libmp3lame -b:a 112k -ac 2 "$f.optimized.mp3" >/dev/null 2>&1
              if [ -s "$f.optimized.mp3" ]; then mv "$f.optimized.mp3" "$f"; fi
            done
          fi

      - name: Prepare web assets (copy www + bundle fonts)
        run: npm run prepare-web

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android project (permissions, icons, version)
        run: node scripts/patch-android.mjs
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/CardStudio.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardStudio-apk
          path: out/CardStudio.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" out/CardStudio.apk \
            --title "CardStudio build ${{ github.run_number }}" \
            --notes "APK built automatically from commit ${{ github.sha }}. Install on Android (allow installing from unknown sources)." \
            --latest
