name: Deploy CardStudio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Download and bundle CC0 music library
        run: node scripts/download-music.mjs
      - name: Optimize bundled music for mobile
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            shopt -s nullglob
            for f in www/audio/*.mp3; do
              ffmpeg -y -i "$f" -vn -codec:a libmp3lame -b:a 112k -ac 2 "$f.optimized.mp3" >/dev/null 2>&1
              if [ -s "$f.optimized.mp3" ]; then mv "$f.optimized.mp3" "$f"; fi
            done
          fi

      - name: Prepare web app
        run: npm run prepare-web
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
