<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>CardStudio – کارت استودیو</title><style>:root{--bg:#0f1020;--bg2:#161733;--card:#1c1d3a;--card2:#24264a;--line:rgba(255,255,255,.1);--text:#f2f2f8;--muted:#a3a5c4;--accent:#d4af37;--accent2:#f4d36f;--accent-ink:#241a00;--danger:#ef476f;--ok:#06d6a0;--canvas-bg:#23243f;--radius:16px;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);color-scheme:dark}
:root[data-theme=light]{--bg:#f5f4ef;--bg2:#ffffff;--card:#ffffff;--card2:#efede5;--line:rgba(0,0,0,.1);--text:#1b1b2b;--muted:#6b6d85;--accent:#a67c00;--accent2:#c9a24a;--accent-ink:#fff;--canvas-bg:#d9d8d2;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Vazirmatn","Montserrat",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:15px;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 16px calc(24px + var(--sab))}
.topbar{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--sat)) 12px 10px;background:var(--bg2);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn:active,.icon-btn.on{background:var(--card2)}
.icon-btn:disabled{opacity:.35}
.ic{flex:none}
[dir=rtl] .flip-rtl{transform:scaleX(-1)}
.tabbar{display:flex;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tabbar button{flex:1;border:0;background:none;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.tabbar button.on{color:var(--accent2)}
.btn{border:1px solid var(--line);background:var(--card2);padding:10px 16px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;justify-content:center;font-weight:600}
.btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--accent-ink);border:0}
.btn.danger{background:var(--danger);border:0;color:#fff}
.btn.block{width:100%}
.btn.small{padding:6px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45}
.input,select.input,textarea.input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:0}
.input:focus{border-color:var(--accent)}
textarea.input{resize:vertical;min-height:70px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>span{font-size:13px;color:var(--muted)}
.field small{color:var(--muted);font-size:12px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.center{text-align:center}
.muted{color:var(--muted)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;font-size:16px;font-weight:700}
.sec-title a,.sec-title button.link{font-size:13px;color:var(--accent2);background:none;border:0;font-weight:500}
.search{position:relative}
.search .ic{position:absolute;top:50%;inset-inline-start:12px;transform:translateY(-50%);color:var(--muted)}
.search input{padding-inline-start:40px;border-radius:14px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.hero .tile{border:0;border-radius:var(--radius);padding:14px;text-align:start;background:var(--card);display:flex;flex-direction:column;gap:8px;min-height:88px}
.hero .tile b{font-size:14px}
.hero .tile small{color:var(--muted)}
.hero .tile.gold{background:linear-gradient(135deg,#6b4e14,#d4af37);color:#201600}
.hero .tile.gold small{color:#3a2a00}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.cat{background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--line);text-align:start;display:flex;flex-direction:column;gap:6px;min-height:84px}
.cat .em{font-size:24px}
.cat b{font-size:13.5px;line-height:1.5}
.cat small{color:var(--muted)}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:none;scroll-snap-align:start}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tpl{position:relative;border:0;background:var(--card);border-radius:14px;padding:6px;text-align:start;display:flex;flex-direction:column;gap:6px}
.tpl .thumb{width:100%;aspect-ratio:5/7;border-radius:10px;background:var(--card2) center/cover;overflow:hidden;position:relative}
.tpl .thumb canvas{width:100%;height:100%;display:block;object-fit:cover}
.tpl .cap{font-size:12px;color:var(--muted);padding:0 4px 2px;display:flex;justify-content:space-between;gap:4px}
.badge{position:absolute;top:8px;inset-inline-start:8px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--accent-ink);font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;display:inline-flex;gap:3px;align-items:center}
.badge.free{background:rgba(6,214,160,.9);color:#02291f}
.hscroll .tpl{width:132px}
.chips,.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg button{border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:999px;white-space:nowrap;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.list-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px 12px;border:1px solid var(--line)}
.list-item .mini{width:46px;height:64px;border-radius:7px;background:var(--card2);overflow:hidden;flex:none}
.list-item .mini img{width:100%;height:100%;object-fit:cover;display:block}
.list-item b{display:block;font-size:14px}
.list-item small{color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
/* modal */
.backdrop{position:fixed;inset:0;background:rgba(5,5,15,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:20px;width:100%;max-width:440px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal.wide{max-width:640px}
.modal.sheet{align-self:flex-end;max-width:640px;border-radius:22px 22px 0 0;max-height:82vh;padding-bottom:var(--sab)}
.backdrop:has(.sheet){align-items:flex-end;padding:0}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px 8px}
.modal-head b{padding-inline-start:8px}
.modal-body{padding:6px 16px 12px;overflow:auto}
.modal-actions{display:flex;gap:8px;padding:8px 14px 14px}
.modal-actions .btn{flex:1}
.toast{position:fixed;bottom:calc(86px + var(--sab));inset-inline:16px;margin:auto;max-width:420px;background:#111;color:#fff;border-radius:12px;padding:11px 16px;text-align:center;font-size:14px;opacity:0;transform:translateY(12px);transition:.25s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:none}
/* editor */
.editor{position:relative}
.editor-stage{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--canvas-bg)}
.editor-canvas{position:absolute;inset:0;display:block}
.ed-top{display:flex;align-items:center;gap:2px;padding:calc(6px + var(--sat)) 6px 6px;background:var(--bg2);border-bottom:1px solid var(--line)}
.ed-top .sp{flex:1}
.ed-tools{display:flex;gap:2px;overflow-x:auto;background:var(--bg2);border-top:1px solid var(--line);padding:4px 6px;scrollbar-width:none}
.ed-tools button{flex:none;min-width:62px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:10px;font-size:11px;color:var(--muted)}
.ed-tools button.on{background:var(--card2);color:var(--accent2)}
.ed-tools button:active{background:var(--card2)}
.ed-ctx{background:var(--bg2);border-top:1px solid var(--line);max-height:42vh;overflow:auto;padding:8px 12px 10px;max-height:34vh;overflow-y:auto}
.ed-ctx .row{margin-bottom:8px}
.ed-ctx label.mini{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);flex:1;min-width:84px}
.ed-ctx input[type=range]{width:100%;accent-color:var(--accent)}
.ed-ctx input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:2px}
.swatches{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.swatches button{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.view-ctrl{position:absolute;inset-inline-end:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.view-ctrl button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);display:flex;align-items:center;justify-content:center;opacity:.92}
.page-pill{position:absolute;inset-inline-start:8px;bottom:8px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;display:flex;gap:6px;align-items:center}
.layer{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:10px;padding:6px 8px;border:1px solid transparent}
.layer.sel{border-color:var(--accent)}
.layer .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer.hid{opacity:.45}
.clip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.clip-grid button{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:#f1efe8;padding:6px;display:flex}
.clip-grid canvas{width:100%;height:100%}
.fx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.fx-grid button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 6px;font-size:12.5px}
.fx-grid button.on{border-color:var(--accent);background:var(--card2);color:var(--accent2)}
.preview-wrap{display:flex;justify-content:center;background:#000;border-radius:14px;padding:8px}
.preview-wrap canvas{max-width:100%;max-height:48vh;border-radius:6px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:start}
.stat{display:flex;gap:8px;margin:10px 0}
.stat div{flex:1;background:var(--card);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--accent2)}
.stat small{color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--card2)}
.pill.ok{background:rgba(6,214,160,.2);color:var(--ok)}.pill.no{background:rgba(239,71,111,.2);color:var(--danger)}
.progress{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .15s}
.splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;flex-direction:column;gap:12px}
.help h3{margin:18px 0 6px;color:var(--accent2)}.help p,.help li{line-height:1.9;color:var(--text)}
.offline-badge{font-size:11px;background:rgba(6,214,160,.18);color:var(--ok);padding:2px 8px;border-radius:99px}
@media (min-width:820px){#app{max-width:980px;margin:0 auto;border-inline:1px solid var(--line)}}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--accent2)}.stat small{font-size:11px;color:var(--muted)}
.guest-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.card-sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.layer{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px;background:var(--card)}
.layer.sel{border-color:var(--accent)}.layer.hid{opacity:.5}.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.grow{flex:1;min-width:0}
